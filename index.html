<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cap Léo">
<link rel="manifest" href="data:application/manifest+json;charset=utf-8,{%22name%22:%22Cap%20L%C3%A9o%22,%22short_name%22:%22Cap%20L%C3%A9o%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%230b0f14%22,%22theme_color%22:%22%230b0f14%22}">
<title>Cap Léo</title>
<style>
:root{
  --bg:#0b0f14;--bg2:#121821;--card:#161d27;--ink:#e8eef6;--muted:#8b9bb0;
  --gold:#e4b84a;--teal:#3ecfb2;--rose:#e07a6a;--blue:#6aa8ff;--violet:#a78bfa;
  --ok:#4ade80;--warn:#fbbf24;--bad:#f87171;
  --r:18px;--safe-b:env(safe-area-inset-bottom,12px);--safe-t:env(safe-area-inset-top,8px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%}
body{
  background:
    radial-gradient(900px 500px at 10% -10%,rgba(228,184,74,.14),transparent 50%),
    radial-gradient(700px 420px at 110% 10%,rgba(62,207,178,.10),transparent 45%),
    radial-gradient(600px 400px at 50% 120%,rgba(106,168,255,.08),transparent 40%),
    var(--bg);
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:18px 18px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2a3544;border-radius:8px}
.app{max-width:980px;margin:0 auto;padding:calc(12px + var(--safe-t)) 14px calc(92px + var(--safe-b))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{font-weight:800;letter-spacing:.04em;font-size:13px;color:var(--gold);text-transform:uppercase}
h1{font-size:26px;margin:4px 0 0;letter-spacing:-.03em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.iconbtn{min-width:44px;min-height:44px;border:0;border-radius:14px;background:linear-gradient(#1c2532,#121820);color:var(--ink);box-shadow:0 8px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);cursor:pointer;font-size:16px}
.iconbtn:active{transform:translateY(2px);box-shadow:0 2px 6px rgba(0,0,0,.4),inset 0 2px 6px rgba(0,0,0,.35)}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015)),var(--card);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 18px 40px rgba(0,0,0,.38),0 1px 0 rgba(255,255,255,.06) inset;
  border-radius:var(--r);padding:16px;margin:12px 0;position:relative;
  animation:rise .45s ease both;
}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}
.accent-gold{--acc:var(--gold)}.accent-teal{--acc:var(--teal)}.accent-blue{--acc:var(--blue)}.accent-violet{--acc:var(--violet)}.accent-rose{--acc:var(--rose)}
.kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc,#e4b84a);font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.space{justify-content:space-between}
.btn{
  min-height:44px;padding:0 16px;border:0;border-radius:12px;cursor:pointer;font-weight:700;color:#0b0f14;
  background:linear-gradient(#f3d27a,var(--gold));
  box-shadow:0 8px 0 #9a7320,0 12px 20px rgba(0,0,0,.35);
}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 #9a7320}
.btn.ghost{background:linear-gradient(#243040,#1a2330);color:var(--ink);box-shadow:0 8px 0 #0c1118,0 12px 20px rgba(0,0,0,.3)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;box-shadow:0 5px 0 #9a7320}
.btn.teal{background:linear-gradient(#7aead4,var(--teal));box-shadow:0 8px 0 #1f8a76}
.btn.rose{background:linear-gradient(#f3a79c,var(--rose));box-shadow:0 8px 0 #8a433a;color:#1a0c0a}
input,textarea,select{
  width:100%;background:#0e141c;border:1px solid #2a3544;color:var(--ink);border-radius:12px;
  padding:12px 12px;font-size:16px;outline:none
}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
.tabs{
  position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;overflow-x:auto;padding:8px 10px calc(10px + var(--safe-b));
  background:linear-gradient(180deg,transparent,rgba(11,15,20,.92) 20%,#0b0f14);
  z-index:20;-webkit-overflow-scrolling:touch
}
.tab{
  flex:0 0 auto;min-height:48px;min-width:72px;padding:8px 12px;border:0;border-radius:14px;cursor:pointer;
  background:#151c26;color:var(--muted);font-weight:700;font-size:12px
}
.tab.on{color:#0b0f14;background:linear-gradient(#f3d27a,var(--gold));box-shadow:0 6px 0 #9a7320}
.panel{display:none}.panel.on{display:block}
.ring-wrap{display:flex;align-items:center;gap:18px}
.ring{width:118px;height:118px;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),#223040 0);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 0 0 8px #0e141c}
.ring i{width:78px;height:78px;border-radius:50%;background:#0e141c;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:22px}
.weekbar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.daychip{min-height:64px;border:0;border-radius:12px;background:#101820;color:var(--ink);cursor:pointer;padding:6px 2px}
.daychip.on{outline:2px solid var(--gold)}
.daychip .d{font-size:11px;color:var(--muted)}
.habit{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #223040}
.dome{
  width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;flex:0 0 44px;
  background:radial-gradient(circle at 35% 30%,#3a4656,#1a222c);
  box-shadow:0 6px 0 #0a0e13,inset 0 2px 4px rgba(255,255,255,.08)
}
.dome.on{background:radial-gradient(circle at 35% 28%,#fff7d1,var(--gold) 45%,#b88920);box-shadow:0 4px 0 #7a5a12,inset 0 2px 8px rgba(255,255,255,.55)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{min-height:36px;border:0;border-radius:999px;padding:0 10px;background:#1a2330;color:var(--muted);cursor:pointer;font-size:12px}
.chip.on{background:#2a2414;color:var(--gold)}
.grid7{display:grid;grid-template-columns:110px repeat(7,1fr);gap:4px;overflow:auto;font-size:12px}
.cell{min-height:40px;border-radius:8px;background:#101820;display:grid;place-items:center;cursor:pointer}
.cell.h{background:transparent;color:var(--muted);cursor:default}
.cell.on{background:linear-gradient(#f3d27a,var(--gold));color:#111}
.kpi{flex:1;min-width:120px;background:#101820;border-radius:14px;padding:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#1b2430;border:1px solid #334155;padding:10px 14px;border-radius:12px;z-index:40;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1}
.bar{height:10px;background:#1a2330;border-radius:99px;overflow:hidden;position:relative}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--acc,#e4b84a),#fff1b8);position:relative}
.bar>span::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 2.2s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.rules{font-size:14px;line-height:1.5}
.rules li{margin:6px 0}
.overlay{position:fixed;inset:0;background:rgba(5,8,12,.82);z-index:50;display:grid;place-items:center;padding:18px}
.overlay .card{max-width:460px;width:100%}
.hidden{display:none!important}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{border-bottom:1px solid #223040;padding:8px 6px;text-align:left}
.warn{color:var(--warn)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.goal{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #223040}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px}
.chart{width:100%;height:140px}
.mem{background:#3a2a12;color:#f3d27a;padding:8px 12px;border-radius:10px;font-size:12px;margin-bottom:10px}
details{background:#101820;border-radius:12px;padding:10px 12px}
details+details{margin-top:8px}
.prio input{margin:6px 0}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="tabs" id="tabs"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
var NAME="Léo";
var APP="Cap Léo";
var LS="capleo_v1";
var memOnly=false;
var memState=null;
var viewDay=iso(new Date());
var tab="jour";
var TABS=[
  {id:"jour",label:"☀️ Jour",acc:"gold"},
  {id:"semaine",label:"📅 Semaine",acc:"teal"},
  {id:"argent",label:"💰 Argent",acc:"gold"},
  {id:"objectifs",label:"🎯 Objectifs",acc:"violet"},
  {id:"evo",label:"🚀 Évolution",acc:"blue"}
];
var DEFAULT_HABITS=[
  {id:"sport",name:"Sport (mar/jeu/sam/dim)",goal:"Séance salle / sport",weight:2,bonus:false,days:[2,4,6,0],weak:false},
  {id:"sleep",name:"Sommeil — max 01h00",goal:"Au lit avant 1h",weight:2,bonus:false,days:null,weak:false},
  {id:"focus",name:"Focus du jour",goal:"Concentration réelle, pas de mode zombie",weight:3,bonus:false,days:null,weak:true},
  {id:"proc",name:"Procrastination < 1h",goal:"Moins d'1h de fuite",weight:2,bonus:false,days:null,weak:false},
  {id:"work",name:"Work 30 min",goal:"30 min de vrai travail (lycée / 10K / projets)",weight:0,bonus:true,days:null,weak:true},
  {id:"eau",name:"Eau 1,5 L",goal:"1,5 litre",weight:0,bonus:true,days:null,weak:true},
  {id:"silence",name:"Silencieux dans la vie",goal:"Calme, moins de bruit inutile",weight:0,bonus:true,days:null,weak:false},
  {id:"lecture",name:"Lecture 10 min",goal:"Éco / trading / philo humaine",weight:0,bonus:true,days:null,weak:false}
];
var GOLDEN=[
  "Jamais deux jours ratés d'affilée.",
  "30 minutes de work avant les excuses.",
  "Le focus se décide, il ne tombe pas du ciel.",
  "L'argent attend 48 h.",
  "Fatigue ≠ permission de tout lâcher : version mini.",
  "Progrès > perfection.",
  "Ce qui est mesuré avance — surtout vers 10K."
];
var DEFAULT_GOALS=[
  {id:"g1",title:"10 000 € — goal de vie",cat:"Mission",due:"",done:false},
  {id:"g2",title:"4 000 € d'épargne avant février",cat:"Argent",due:"2027-02-01",done:false},
  {id:"g3",title:"Tenir le rythme sport 4×/semaine",cat:"Corps",due:"2026-10-03",done:false},
  {id:"g4",title:"Work 30 min × 30 jours (cumul)",cat:"Discipline",due:"2026-10-03",done:false}
];

function iso(d){d=new Date(d);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function pad(n){return (n<10?"0":"")+n}
function parseISO(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)}
function monday(s){var d=parseISO(s);var day=d.getDay();var diff=day===0?-6:1-day;d.setDate(d.getDate()+diff);return iso(d)}
function daysLeft(s){var a=parseISO(iso(new Date())),b=parseISO(s);return Math.round((b-a)/86400000)}
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]})}
function uid(){return "id"+Math.random().toString(36).slice(2,9)}
function dow(s){return parseISO(s).getDay()}
function frDay(s){return ["dim","lun","mar","mer","jeu","ven","sam"][dow(s)]}
function frLong(s){try{return parseISO(s).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}catch(e){return s}}

function blank(){
  return {
    v:1,name:NAME,onboarded:false,lastExport:iso(new Date()),
    habits:JSON.parse(JSON.stringify(DEFAULT_HABITS)),
    days:{},
    money:{goal:4000,deadline:"2027-02-01",balance:0,moves:[],wishes:[]},
    goals:JSON.parse(JSON.stringify(DEFAULT_GOALS)),
    reviews:{},
    xp:0,levelSeen:1,wins:[],
    rules:GOLDEN.slice()
  };
}
function load(){
  try{
    var raw=localStorage.getItem(LS);
    if(!raw) return blank();
    var s=JSON.parse(raw);
    var b=blank();
    for(var k in b) if(s[k]==null) s[k]=b[k];
    if(!s.money) s.money=b.money;
    return s;
  }catch(e){
    memOnly=true;
    if(memState) return memState;
    return blank();
  }
}
function save(s){
  memState=s;
  try{localStorage.setItem(LS,JSON.stringify(s));memOnly=false;}
  catch(e){memOnly=true;}
}
var S=load();
(S.goals||[]).forEach(function(g){
  if(/10\s*000|10K/i.test(g.title||"")){ g.due=""; if(/en 1 mois/i.test(g.title)) g.title="10 000 € — goal de vie"; }
});
save(S);

function dayObj(key){
  if(!S.days[key]) S.days[key]={habits:{},notes:"",mood:5,sleepHour:"",mits:["","",""],perfect:false,counters:{workMin:0,procMin:0},fatigue:5};
  var d=S.days[key];
  if(!d.habits) d.habits={};
  if(!d.mits) d.mits=["","",""];
  if(!d.counters) d.counters={workMin:0,procMin:0};
  return d;
}
function habitDue(h,key){
  if(!h.days) return true;
  return h.days.indexOf(dow(key))>=0;
}
function dayScore(key){
  var d=dayObj(key);
  var tot=0,got=0;
  S.habits.forEach(function(h){
    if(h.bonus) return;
    if(!habitDue(h,key)) return;
    var w=h.weight||1;
    tot+=w;
    if(d.habits[h.id]) got+=w;
  });
  if(!tot) return 10;
  return Math.round((got/tot)*100)/10;
}
function scoreColor(sc){
  if(sc>=8) return "var(--ok)";
  if(sc>=5) return "var(--warn)";
  return "var(--bad)";
}
function addXP(n,why){
  S.xp=(S.xp||0)+n;
  if(why) pushWin(why);
  save(S);
}
function ranks(){
  return [
    {lv:1,name:"Étincelle",need:0},
    {lv:2,name:"Cadet STMG",need:80},
    {lv:3,name:"Focus junior",need:200},
    {lv:4,name:"Rythme 4×",need:400},
    {lv:5,name:"Machine 30 min",need:700},
    {lv:6,name:"Cap 4K",need:1100},
    {lv:7,name:"Cap 10K",need:1600},
    {lv:8,name:"Léo en mission",need:2300}
  ];
}
function rankOf(xp){
  var r=ranks()[0];
  ranks().forEach(function(x){if(xp>=x.need) r=x});
  return r;
}
function pushWin(t){
  S.wins=S.wins||[];
  S.wins.unshift({t:t,d:iso(new Date()),ts:Date.now()});
  if(S.wins.length>80) S.wins.pop();
}
function toast(m){
  var el=document.getElementById("toast");
  el.textContent=m;el.classList.add("show");
  setTimeout(function(){el.classList.remove("show")},2200);
}
function coachMsg(){
  var h=new Date().getHours();
  var sc=dayScore(iso(new Date()));
  var d=dayObj(iso(new Date()));
  var y=dayScore(addDays(iso(new Date()),-1));
  if(y<5 && sc<5) return NAME+", alerte : jamais deux jours ratés d'affilée. Version mini aujourd'hui — 5 minutes de work et tu casses la série.";
  if(h<11) return "Bonjour "+NAME+". Priorité du matin : 1 MIT, puis le lycée. Le 10K ne se fera pas tout seul.";
  if(h<16) return NAME+", milieu de journée. Si le focus a fuité, tu le rattrapes en 30 min, pas en rumination.";
  if(h<20){
    var wd=new Date().getDay();
    if(wd===2||wd===4) return "Créneau salle "+NAME+" — 18h20. Le sport est ton point fort : tu y vas, point.";
    if(wd===1) return "Batterie 19h30. Le groupe, c'est aussi de la discipline. Profite, puis work mini.";
    if(wd===5) return "Vendredi : 16h30–18h work. C'est le créneau d'or de la semaine.";
    return NAME+", fin d'après-midi. Eau, silence, 30 min. Score actuel : "+sc+"/10.";
  }
  if(!d.habits.sleep) return "Couvre-feu 01h00, "+NAME+". Téléphone plus loin. La fatigue de demain se joue maintenant.";
  return "Soirée "+NAME+". Note 1 fierté. Score "+sc+"/10 — on vise mieux que « ok ».";
}

function render(){
  var acc=(TABS.filter(function(t){return t.id===tab})[0]||TABS[0]).acc;
  document.getElementById("app").innerHTML=headHTML()+memBanner()+coachHTML()+countdownHTML()+panelsHTML();
  document.getElementById("tabs").innerHTML=TABS.map(function(t){
    return '<button class="tab '+(t.id===tab?"on":"")+'" data-act="tab" data-id="'+t.id+'">'+esc(t.label)+"</button>";
  }).join("");
  document.querySelectorAll(".panel").forEach(function(p){p.classList.toggle("on",p.id==="p-"+tab)});
  var root=document.getElementById("app");
  root.className="app accent-"+acc;
  if(!S.onboarded) overlayOnboard();
  if(S.lastExport && daysLeft(addDays(S.lastExport,14))<0) toast("Pense à exporter tes données (>14 j)");
}
function memBanner(){
  return memOnly?'<div class="mem">Stockage bloqué (aperçu). Tes données tiennent en mémoire — exporte dès que tu peux.</div>':"";
}
function headHTML(){
  return '<div class="top"><div><div class="brand">'+esc(APP)+'</div><h1>Salut '+esc(NAME)+'</h1><div class="sub">Terminale STMG · palier 4K avant février</div></div><div class="row"><button class="iconbtn" data-act="export" title="Exporter">⤓</button><button class="iconbtn" data-act="import" title="Importer">⤒</button></div></div>';
}
function coachHTML(){
  return '<div class="card"><div class="kicker">Coach</div><p style="margin:8px 0 0">'+esc(coachMsg())+'</p><details style="margin-top:10px"><summary>Règles d\'or</summary><ol class="rules">'+S.rules.map(function(r){return "<li>"+esc(r)+"</li>"}).join("")+'</ol></details></div>';
}
function countdownHTML(){
  var b=daysLeft("2027-02-01");
  return '<div class="row"><div class="kpi"><div class="kicker">4K</div><div style="font-size:22px;font-weight:800">'+(b<0?"échéance dépassée":b+" j")+'</div><div class="small muted">épargne avant février 2027</div></div><div class="kpi"><div class="kicker">Anniv 18 ans</div><div style="font-size:22px;font-weight:800">'+daysLeft("2027-02-18")+' j</div><div class="small muted">18 fév. 2027</div></div></div>';
}
function panelsHTML(){
  return '<div id="p-jour" class="panel">'+jourHTML()+'</div>'+
    '<div id="p-semaine" class="panel">'+semaineHTML()+'</div>'+
    '<div id="p-argent" class="panel">'+argentHTML()+'</div>'+
    '<div id="p-objectifs" class="panel">'+objectifsHTML()+'</div>'+
    '<div id="p-evo" class="panel">'+evoHTML()+'</div>'+
    '<input id="fileIn" type="file" accept="application/json" class="hidden">';
}

function jourHTML(){
  var d=dayObj(viewDay);
  var sc=dayScore(viewDay);
  var mon=monday(viewDay);
  var days=[];
  for(var i=0;i<7;i++) days.push(addDays(mon,i));
  var msg="";
  if(sc>=9) msg="Journée de haut niveau, "+NAME+". Ça, c'est la preuve que tu avances.";
  else if(sc>=7) msg="Solide. Encore 1 habitude et tu bascules en journée forte.";
  else if(sc>=5) msg="Milieu de tableau. Le point faible (work / focus) décide du reste.";
  else {
    var y=dayScore(addDays(viewDay,-1));
    msg = y<5 ? "Alerte série : jamais deux jours ratés d'affilée. Fais la version mini." : "Journée molle. Une seule victoire maintenant (30 min work) change le récit.";
  }
  var habits=S.habits.map(function(h){
    if(!habitDue(h,viewDay) && !h.bonus) return "";
    var on=!!d.habits[h.id];
    var extra=h.id==="work"?'<div class="chips"><span class="small muted">minutes work</span><button class="chip" data-act="cnt" data-k="workMin" data-n="15">+15</button><button class="chip" data-act="cnt" data-k="workMin" data-n="30">+30</button><span class="small">'+(d.counters.workMin||0)+' min</span></div>':"";
    if(h.id==="proc") extra='<div class="chips"><span class="small muted">procrastination</span><button class="chip" data-act="cnt" data-k="procMin" data-n="15">+15 min fuite</button><span class="small">'+(d.counters.procMin||0)+' min</span></div>';

function cumulPoints(){
  var bal=0, arr=[{x:0,y:0}];
  (S.money.moves||[]).slice().sort(function(a,b){return a.d<b.d?-1:1}).forEach(function(m,i){bal+=m.amt;arr.push({x:i+1,y:bal})});
  if(arr.length===1) arr.push({x:1,y:S.money.balance});
  return arr;
}
function svgPath(pts){
  var maxX=Math.max.apply(null,pts.map(function(p){return p.x}))||1;
  var maxY=Math.max.apply(null,pts.map(function(p){return p.y}).concat([S.money.goal,1]));
  return pts.map(function(p,i){
    var x=(p.x/maxX)*300, y=140-(p.y/maxY)*130-5;
    return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);
  }).join(" ");
}

function statsN(n){
  var keys=Object.keys(S.days).sort().slice(-n);
  if(!keys.length) return {n:0,avg:0,perf:0,work:0,focus:0};
  var sum=0,perf=0,work=0,focus=0;
  keys.forEach(function(k){var sc=dayScore(k);sum+=sc;if(dayObj(k).perfect)perf++;work+=dayObj(k).counters.workMin||0;if(dayObj(k).habits.focus)focus++});
  return {n:keys.length,avg:Math.round(sum/keys.length*10)/10,perf:perf,work:work,focus:focus};
}
function vs30(){
  var t=iso(new Date()), o=addDays(t,-30);
  function pack(k){
    var d=S.days[k]||{habits:{},counters:{},mood:0};
    return {sc:S.days[k]?dayScore(k):null, work:(d.counters&&d.counters.workMin)||0, mood:d.mood||0, sleep:d.habits&&d.habits.sleep?1:0, focus:d.habits&&d.habits.focus?1:0, sport:d.habits&&d.habits.sport?1:0, eau:d.habits&&d.habits.eau?1:0, money:S.money.balance};
  }
  function win(a,b,k,inv){
    if(a[k]==null||b[k]==null) return "＝ n/a";
    if(a[k]===b[k]) return "＝";
    var up=b[k]>a[k]; if(inv) up=!up;
    return (up?"▲ ":"▼ ")+Math.abs(Math.round((b[k]-a[k])*10)/10);
  }
  var A=pack(o), B=pack(t);
  var weekNow=avgRange(addDays(t,-6),t), weekThen=avgRange(addDays(o,-6),o);
  return [
    {k:"Score du jour",a:A.sc==null?"—":A.sc,b:B.sc,d:win(A,B,"sc")},
    {k:"Moy. 7j",a:weekThen,b:weekNow,d:weekNow===weekThen?"＝":(weekNow>weekThen?"▲":"▼")+" "+Math.abs(Math.round((weekNow-weekThen)*10)/10)},
    {k:"Work min (jour)",a:A.work,b:B.work,d:win(A,B,"work")},
    {k:"Humeur",a:A.mood,b:B.mood,d:win(A,B,"mood")},
    {k:"Sommeil tenu",a:A.sleep?"oui":"non",b:B.sleep?"oui":"non",d:win(A,B,"sleep")},
    {k:"Focus",a:A.focus?"oui":"non",b:B.focus?"oui":"non",d:win(A,B,"focus")},
    {k:"Sport",a:A.sport?"oui":"non",b:B.sport?"oui":"non",d:win(A,B,"sport")},
    {k:"Solde €",a:A.money,b:B.money,d:win(A,B,"money")}
  ];
}
function avgRange(a,b){
  var s=0,n=0,x=a;
  while(x<=b){if(S.days[x]){s+=dayScore(x);n++} x=addDays(x,1)}
  return n?Math.round(s/n*10)/10:0;
}
function records(){
  var best=0,streak=0,cur=0,money=0,prev=null;
  Object.keys(S.days).sort().forEach(function(k){
    var sc=dayScore(k); if(sc>best) best=sc;
    if(sc>=7){if(prev===addDays(k,-1)||!prev)cur++; else cur=1; if(cur>streak)streak=cur} else cur=0;
    prev=k;
  });
  (S.money.moves||[]).forEach(function(m){if(m.amt>money)money=m.amt});
  return {best:best,streak:streak,money:money};
}
function monthTable(){
  var map={};
  Object.keys(S.days).forEach(function(k){
    var m=k.slice(0,7); if(!map[m]) map[m]={n:0,s:0,p:0};
    map[m].n++; map[m].s+=dayScore(k); if(dayObj(k).perfect) map[m].p++;
  });
  var keys=Object.keys(map).sort().reverse();
  if(!keys.length) return "<tr><td class='muted'>Pas encore de mois.</td></tr>";
  return "<tr><th>Mois</th><th>Moy.</th><th>Jours</th><th>Parfaits</th></tr>"+keys.map(function(k){
    return "<tr><td>"+k+"</td><td>"+(Math.round(map[k].s/map[k].n*10)/10)+"</td><td>"+map[k].n+"</td><td>"+map[k].p+"</td></tr>";
  }).join("");
}

  if(a==="tab"){tab=t.getAttribute("data-id");render();return}
  if(a==="prev"){viewDay=addDays(viewDay,-1);render();return}
  if(a==="next"){viewDay=addDays(viewDay,1);render();return}
  if(a==="today"){viewDay=iso(new Date());render();return}
  if(a==="goto"){viewDay=t.getAttribute("data-d");tab="jour";render();return}
  if(a==="hab"){setHab(t.getAttribute("data-id"));return}
  if(a==="cnt"){
    var d=dayObj(viewDay); var k=t.getAttribute("data-k"); d.counters[k]=(d.counters[k]||0)+(+t.getAttribute("data-n"));
    if(k==="workMin" && d.counters.workMin>=30) d.habits.work=true;
    if(k==="procMin" && d.counters.procMin<60) d.habits.proc=true;
    save(S);render();return;
  }
  if(a==="perfect"){
    var d=dayObj(viewDay);
    S.habits.forEach(function(h){if(habitDue(h,viewDay)||h.bonus) d.habits[h.id]=true});
    d.perfect=true; addXP(40,"Jour parfait · "+viewDay); toast("Jour parfait, "+NAME+"."); save(S);render();return;
  }
  if(a==="addhabit"){
    var n=prompt("Nom de l'habitude ?"); if(!n) return;
    S.habits.push({id:uid(),name:n,goal:n,weight:1,bonus:false,days:null,weak:false});
    save(S);render();return;
  }
  if(a==="grid"){
    var hid=t.getAttribute("data-hid"), day=t.getAttribute("data-d");
    var d=dayObj(day); d.habits[hid]=!d.habits[hid]; save(S);render();return;
  }
  if(a==="revdone"){
    var mon=monday(viewDay); S.reviews[mon]=S.reviews[mon]||{}; S.reviews[mon].done=true;
    addXP(25,"Revue hebdo "+mon); toast("Revue faite. Un seul engagement, "+NAME+"."); save(S);render();return;
  }
  if(a==="held"){
    var mon=monday(viewDay); var p=S.reviews[addDays(mon,-7)]; if(p) p.held=t.getAttribute("data-v")==="1";
    save(S);render();return;
  }
  if(a==="quickm"){ addMove(+t.getAttribute("data-n"), "saisie rapide"); return}
  if(a==="addmove"){
    var amt=+document.getElementById("mAmt").value, lab=document.getElementById("mLab").value||"mouvement";
    if(!amt){toast("Montant ?");return} addMove(amt,lab);return;
  }
  if(a==="addwish"){
    var name=document.getElementById("wName").value, price=+document.getElementById("wPrice").value;
    if(!name||!price){toast("Nom + prix");return}
    S.money.wishes.push({id:uid(),name:name,price:price,t:Date.now(),renounced:false});
    save(S);render();return;
  }
  if(a==="renonce"){
    S.money.wishes.forEach(function(w){if(w.id===t.getAttribute("data-id")) w.renounced=true});
    pushWin("Envie refusée — euros gardés"); save(S);render();return;
  }
  if(a==="gfilter"){objectifsHTML._f=t.getAttribute("data-v");render();return}
  if(a==="gadd"){
    var title=document.getElementById("gTitle").value; if(!title) return;
    S.goals.push({id:uid(),title:title,cat:document.getElementById("gCat").value||"Autre",due:document.getElementById("gDue").value||"",done:false});
    save(S);render();return;
  }
  if(a==="gtog"){
    S.goals.forEach(function(g){if(g.id===t.getAttribute("data-id")){g.done=!g.done; if(g.done) addXP(30,"Objectif : "+g.title)}});
    save(S);render();return;
  }
  if(a==="gdel"){S.goals=S.goals.filter(function(g){return g.id!==t.getAttribute("data-id")});save(S);render();return}
  if(a==="export"){ doExport(); return}
  if(a==="import"){ document.getElementById("fileIn").click(); return}
  if(a==="onboard"){S.onboarded=true;save(S);var ov=document.getElementById("ov"); if(ov) ov.remove();render();return}
});

document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="fileIn" && t.files && t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){ try{ var n=JSON.parse(fr.result); S=n; save(S); toast("Import OK"); render();} catch(err){ toast("JSON invalide"); } };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener("input",function(e){
  var t=e.target, a=t.getAttribute("data-act"); if(!a) return;
  var d=dayObj(viewDay);
  if(a==="mit"){d.mits[+t.getAttribute("data-i")]=t.value;save(S);return}
  if(a==="mood"){d.mood=+t.value;save(S);return}
  if(a==="fat"){d.fatigue=+t.value;save(S);return}
  if(a==="sleepH"){d.sleepHour=t.value;save(S);return}
  if(a==="notes"){d.notes=t.value;save(S);return}
  if(a==="rev"){
    var mon=monday(viewDay); if(!S.reviews[mon]) S.reviews[mon]={fiertes:["","",""],pourquoi:["","","","",""],derive:"",correctif:"",ressenti:5,energie:5,start:"",stop:"",cont:"",engage:"",held:null,done:false};
    var r=S.reviews[mon], f=t.getAttribute("data-f"), i=t.getAttribute("data-i");
    if(i!=null){ if(!r[f]) r[f]=[]; r[f][+i]=t.value; } else { r[f]= t.type==="number"?+t.value:t.value; }
    save(S);
  }
});

function addMove(amt,lab){
  S.money.moves.push({d:iso(new Date()),amt:amt,label:lab});
  S.money.balance=Math.round((S.money.balance+amt)*100)/100;
  if(amt>0) addXP(Math.max(1,Math.round(amt/10)), amt>=50?"Palier d'épargne +"+amt+" €":null);
  save(S);render();
}
function doExport(){
  S.lastExport=iso(new Date()); save(S);
  var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="cap-leo-"+iso(new Date())+".json"; a.click();
  toast("Export téléchargé");
}

document.addEventListener("keydown",function(e){
  var tag=(e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select") return;
  if(e.key>="1" && e.key<=String(TABS.length)){tab=TABS[+e.key-1].id;render()}
  if(e.key==="ArrowLeft"){viewDay=addDays(viewDay,-1);render()}
  if(e.key==="ArrowRight"){viewDay=addDays(viewDay,1);render()}
  if(e.key==="t"||e.key==="T"){viewDay=iso(new Date());render()}
});

render();
})();
</script>
</body>
</html>
